{% extends 'base.html' %}

{% block title %}Sign In | NEXUS AI E-Commerce{% endblock %}

{% block content %}
<div class="auth-box">
  <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
  <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">Sign in to access your orders & personalized AI recommendations</p>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Username</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      {{ form.password }}
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
    Don't have an account? <a href="{% url 'auth:register' %}" style="color: #818cf8; font-weight: 600;">Create Account</a>
  </div>
</div>
{% endblock %}
